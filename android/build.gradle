// App Android do Bolão Muita Paz: WebView do site + lembretes locais + notificações push (Firebase Cloud Messaging)
plugins {
    id 'com.android.application' version '8.7.3'
    id 'com.google.gms.google-services' version '4.4.2'
}

def senha = file('keystore-senha.txt').text.trim()
// Versão: ./build.sh <número>  (precisa subir a cada APK novo, senão não instala por cima)
def versao = (project.findProperty('versao') ?: '3') as int

android {
    namespace 'br.com.bolaomuitapaz.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'br.com.bolaomuitapaz.app'
        minSdk 24
        targetSdk 34
        versionCode versao
        versionName "1.$versao"
    }
    // A mesma chave das versões anteriores: nunca trocar
    signingConfigs {
        release {
            storeFile file('bolao-release.jks')
            storePassword senha
            keyAlias 'bolao'
            keyPassword senha
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    sourceSets {
        main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
