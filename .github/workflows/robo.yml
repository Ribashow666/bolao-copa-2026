# Robô do bolão: placar da ESPN + notificações do app. Ver robo/robo.mjs.
name: Robô do bolão
on:
  schedule:
    - cron: '*/5 * * * *'   # o GitHub pode atrasar alguns minutos em horário de pico
  workflow_dispatch:        # botão "Run workflow" pra rodar na hora
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: robo/package-lock.json
      - run: npm ci --omit=dev
        working-directory: robo
      - run: node robo/robo.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
